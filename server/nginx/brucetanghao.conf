# BruceTang 个人作品集后端服务
# Nginx 反向代理配置
# 功能:静态前端 + /api/* 转发到 Node.js 后端(4001 端口)
#
# 部署位置:/etc/nginx/conf.d/brucetanghao.conf
# 启用:nginx -t && nginx -s reload

# 后端 Node.js 服务
upstream brucetanghao_backend {
    server 127.0.0.1:4001;
    keepalive 16;
}

server {
    listen 80;
    # 备案通过前用 IP 访问开发,通过后启用域名
    server_name brucetanghao.com;

    # 前端静态文件(docsify)
    root /var/www/brucetanghao;
    index index.html;

    # API 反向代理到 Node.js 后端
    location /api/ {
        proxy_pass http://brucetanghao_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # docsify SPA 回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 安全头
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;

    # 访问日志
    access_log /var/log/nginx/brucetanghao.access.log;
    error_log /var/log/nginx/brucetanghao.error.log;
}
