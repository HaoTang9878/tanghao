<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BruceTang的作品集</title>
    <meta name="description" content="BruceTang的个人作品集 - 记录所学、所思、所做">
    <!-- docsify 核心样式和脚本 -->
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse@1/dist/sidebar.min.css">
</head>
<body>
    <div id="app">加载中...</div>
    <script>
        window.$docsify = {
            // 网站名称（显示在侧边栏顶部）
            name: "BruceTang的作品集",
            // 仓库地址（显示在右上角图标）

            // 主页文件
            homepage: "README.md",
            // 加载侧边栏
            loadSidebar: true,
            // 侧边栏层级折叠
            subMaxLevel: 3,
            // 自动头部锚点
            autoHeader: true,
            // 搜索功能
            search: {
                placeholder: "搜索文章",
                noData: "没有找到结果",
                depth: 3
            },
            // 主题色
            themeColor: "#42b983",
            // 字体大小
            fontSize: "15px"
        };
    </script>
    <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse@1"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
